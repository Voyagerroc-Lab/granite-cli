# Recommended configuration for the `opencode` launcher.
# Identical to claude.yaml because opencode supports the same set of
# capabilities (AgentModel, Mcp, SubAgent).

launcher: "opencode"

capabilities:
  - capability: agent-model
    models:
      model_id:
        min_context_length: 65536
        models:
          # Prefer a hosted/API-served build at full precision when one is
          # configured (OpenRouter, or an Ollama instance already serving
          # this model), before falling back to a local quantized GGUF
          # build, then to a raw safetensors checkpoint as a last resort.
          - model: granite-4.2-30b
            variant_formats:
              - OpenRouter
              - safetensors
          - model: granite-4.2-30b
            variant_formats:
              - Ollama
              - GGUF
            variant_precisions:
              - Q4_K_M
              - Q5_K_M
              - Q6_K
              - Q8_0
          - model: granite-4.2-8b
            variant_formats:
              - OpenRouter
          - model: granite-4.2-8b
            variant_formats:
              - Ollama
              - GGUF
            variant_precisions:
              - Q8_0

  - capability: sub-agent-code
    models:
      model_id:
        min_context_length: 65536
        models:
          - model: granite-4.2-30b
            variant_formats:
              - OpenRouter
          - model: granite-4.2-30b
            variant_formats:
              - Ollama
              - GGUF
            variant_precisions:
              - Q4_K_M
              - Q5_K_M
              - Q6_K
              - Q8_0

  - capability: sub-agent-explore
    models:
      model_id:
        min_context_length: 65536
        models:
          - model: granite-4.2-3b
            variant_formats:
              - Ollama
              - GGUF
            variant_precisions:
              - Q4_K_M
              - Q5_K_M
              - Q6_K
              - Q8_0

  - capability: sub-agent-plan
    models:
      model_id:
        min_context_length: 65536
        models:
          - model: granite-4.2-30b
            variant_formats:
              - OpenRouter
          - model: granite-4.2-30b
            variant_formats:
              - Ollama
              - GGUF
            variant_precisions:
              - Q4_K_M
              - Q5_K_M
              - Q6_K
              - Q8_0

  - capability: vision-mcp
    models:
      model_id:
        min_context_length: 4096
        models:
          - model: granite-vision-4.1-4b
            variant_precisions:
              - Q4_K_M
              - Q5_K_M
              - Q6_K
              - Q8_0
