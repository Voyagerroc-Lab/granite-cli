          - model: granite-4.2-3b
            variant_formats:
              - Ollama
              - GGUF
            variant_precisions:
              - Q4_K_M
              - Q5_K_M
              - Q6_K
              - Q8_0

  - capability: sub-agent-plan
    models:
      model_id:
        min_context_length: 65536
        models:
          - model: granite-4.2-30b
            variant_formats:
              - OpenRouter
          - model: granite-4.2-30b
            variant_formats:
              - Ollama
              - GGUF
            variant_precisions:
              - Q4_K_M
              - Q5_K_M
              - Q6_K
              - Q8_0

  - capability: vision-mcp
